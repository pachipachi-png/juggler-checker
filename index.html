<script>
// 機種の一覧。ページを追加したらここに1件足す（status: 'ready' | 'soon'）

// keywords には略称・ひらがな・英字など検索で使われそうな呼び方を入れる
const MACHINES = [

  },
  {
    name: 'スマスロ モンキーターンV',
    sub: '5枚役＋AT初当り、トロフィー・舟券・獲得枚数で絞り込み',
    inputs: ['総G数', '5枚役', 'AT初当り（任意）', 'トロフィー・舟券'],
    path: 'monkey/',
    status: 'ready',
    hot: 8,
    tag: '',
    keywords: 'モンキーターン もんきーたーん モンキー もんきー モンキー5 モンキーv モンキーターン5 モンキーターンv もんきーたーんv 5枚役 ごまいやく monkey monkeyturn'
  },
  {
    name: 'スマスロ 獣王',
    sub: '2026年10月5日導入の新台。サバンナチャンス（AT）初当りで判別',
    inputs: ['通常時G数', 'AT初当り回数'],
    path: 'juuou/',
    status: 'ready',
    hot: 2,
    tag: '新台',
    keywords: '獣王 じゅうおう ジュウオウ juuou サバンナチャンス スマスロ すますろ サミー 新台'
  },
  {
    name: 'スマスロ リコリス・リコイル',
    sub: 'CZ確率＋共通ベル、終了画面・トロフィーで絞り込み',

    hot: 6,
    tag: '',

  },
  {
    name: 'スロット ソードアート・オンラインⅡ',
    sub: 'CZ確率＋AT・強チャンス目B、終了画面・トロフィー・ミニキャラで絞り込み',
    inputs: ['通常時G数', 'CZ回数', 'AT・強チャ目B（任意）', '終了画面・トロフィー'],
    path: 'sao2/',
    status: 'ready',
    hot: 4,
    tag: 'キリト誕生日示唆',
    keywords: 'ソードアートオンライン そーどあーとおんらいん ソードアート・オンライン2 ソードアートオンライン2 sao sao2 SAOII さお えすえーおー'
  },

    status: 'ready',

    path: 'milliongod/',
    status: 'ready',
    hot: 5,
    tag: '',
    keywords: 'ミリオンゴッド みりおんごっど ゴッド ごっど GOD god milliongod 神々の軌跡 かみがみのきせき 軌跡 きせき ミリゴ みりご スマスロ すますろ ミズホ ユニバーサル リプ連 りぷれん 押し順ナビ'
  }
];

// ひらがな→カタカナ、全角英数→半角、小文字化、空白・記号除去で表記ゆれを吸収
function norm(str){
  return (str || '')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60))
    .replace(/[\s・\-ー_／/]/g, '');
}

function card(m){
  const a = document.createElement('a');
  a.className = 'item' + (m.status === 'soon' ? ' soon' : '');
  if (m.status === 'ready') a.href = m.path;
  const chips = m.inputs.map(t => `<span class="chip">${t}</span>`).join('');
  const tag = m.tag ? `<span class="badge hot">${m.tag}</span>` : '';
  a.innerHTML = `<div class="name">${m.name}${tag}${m.status === 'soon' ? '<span class="badge">準備中</span>' : ''}</div>
    <div class="sub">${m.sub}</div>
    ${chips ? `<div class="inputs">${chips}</div>` : ''}`;
  return a;
}

const q = document.getElementById('q');
const listReady = document.getElementById('listReady');
const listSoon = document.getElementById('listSoon');

function render(){
  const k = norm(q.value);
  const hit = MACHINES.filter(m => !k || norm(m.name + m.sub + m.keywords).includes(k))
    .sort((a, b) => (a.hot ?? 99) - (b.hot ?? 99));
  listReady.innerHTML = ''; listSoon.innerHTML = '';
  hit.filter(m => m.status === 'ready').forEach(m => listReady.appendChild(card(m)));
  hit.filter(m => m.status === 'soon').forEach(m => listSoon.appendChild(card(m)));
  document.getElementById('gReady').style.display = listReady.children.length ? '' : 'none';
  document.getElementById('gSoon').style.display = listSoon.children.length ? '' : 'none';
  document.getElementById('empty').style.display = hit.length ? 'none' : 'block';
}

let searchTimer = null;
q.addEventListener('input', () => {
  render();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (q.value.trim() && typeof gtag === 'function') gtag('event', 'search', { search_term: q.value.trim() });
  }, 1200);
});
render();
</script>
